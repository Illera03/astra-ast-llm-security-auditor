[project]
name = "astra-ast-llm-security-auditor"
version = "0.1.0"
description = ""
authors = [
    {name = "Jorge",email = "jillera10@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "tqdm (>=4.70.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["datasets/"]

[dependency-groups]
dev = [
    "ruff (>=0.15.15,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "semgrep (>=1.176.1,<2.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
[tool.poetry]
package-mode = false